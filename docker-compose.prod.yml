# Production stack: optimized app image + MySQL (database not exposed to the host).
#   docker compose -f docker-compose.prod.yml up -d --build
name: typewriter

services:
  app:
    build:
      context: .
      target: prod
    image: typewriter:latest
    env_file: .env.production
    environment:
      NODE_ENV: production
      DB_HOST: db
    ports:
      - "${PORT:-7400}:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    env_file: .env.production # MYSQL_* variables
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mysql-data:
